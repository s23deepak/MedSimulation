# Render Deployment Configuration
# Deploy at: https://render.com

services:
  - type: web
    name: medsimulation
    env: python
    region: oregon
    plan: starter  # Free tier available
    buildCommand: pip install -e .
    startCommand: python main.py --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: VLLM_MODE
        value: simulated
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: medsimulation-data
      mountPath: /app/data
      sizeGB: 1
