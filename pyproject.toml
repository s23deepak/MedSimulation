[project]
name = "medsimulation"
version = "0.1.0"
description = "AI-powered clinical simulation engine for resident training and competency assessment"
readme = "SIMULATION_PROJECT.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.128.4",
    "uvicorn[standard]>=0.30.0",
    "langchain-core>=0.3.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.22",
    "openai>=1.40",
    "httpx>=0.27",
    "pydicom>=2.4.0",
    "beautifulsoup4>=4.12.3",
    "fpdf2>=2.7.9",
]

[project.optional-dependencies]
# Install with: uv sync --extra gpu
gpu = [
    "bitsandbytes>=0.46.1",
    "vllm>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
