[project]
name = "medsimulation"
version = "0.1.0"
description = "Clinical reasoning practice with reviewed cases and traceable educational feedback"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.128.4",
    "uvicorn[standard]>=0.30.0",
    "langchain-core>=0.3.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.22",
    "openai>=1.40",
    "httpx>=0.27",
    "pydicom>=2.4.0",
    "beautifulsoup4>=4.12.3",
    "fpdf2>=2.7.9",
    "modal>=1.4.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pillow>=11.0",
]

[project.optional-dependencies]
# Install with: uv sync --extra gpu
gpu = [
    "bitsandbytes>=0.46.1",
    "vllm>=0.6",
]

# Install with: uv sync --extra modal
modal = [
    "modal>=0.60.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.12",
    "mypy>=1.15",
    "playwright>=1.50",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
files = ["src/web/config.py", "src/web/models.py", "src/simulation/safety.py"]
